<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hourglass</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- Progress fill sits behind everything -->
    <div class="progress-fill" id="progressFill"></div>

    <main class="content">
      <!-- Timer title (editable) -->
      <input
        id="timerTitle"
        class="timer-title"
        type="text"
        placeholder="Add a title…"
        spellcheck="false"
        autocomplete="off" />

      <!-- Big time display -->
      <div class="display" id="display">0:00</div>

      <!-- Sub label (end time / description) -->
      <div class="subline" id="subline"></div>

      <!-- Input row (shown when idle) -->
      <form class="input-row" id="inputRow" autocomplete="off">
        <input
          id="timeInput"
          class="time-input"
          type="text"
          placeholder="e.g. 5 minutes, 1:30, 5:30 pm"
          spellcheck="false"
          autocomplete="off" />
        <button type="submit" class="btn btn-primary" id="startBtn">Start</button>
      </form>

      <!-- Parse hint / error -->
      <div class="hint" id="hint"></div>

      <!-- Quick presets -->
      <div class="presets" id="presets"></div>

      <!-- Controls (shown when running/paused/finished) -->
      <div class="controls" id="controls" hidden>
        <button class="btn" id="pauseBtn">Pause</button>
        <button class="btn" id="addMinBtn">+1:00</button>
        <button class="btn btn-danger" id="stopBtn">Stop</button>
      </div>
    </main>

    <!-- Top-right toolbar -->
    <div class="toolbar">
      <button class="icon-btn" id="pinBtn" title="Always on top">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M14 3l7 7-2 2-1-1-4 4v4l-2 2-3-3-4 4-1-1 4-4-3-3 2-2h4l4-4-1-1z"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm9 4a7 7 0 00-.13-1.32l2.1-1.63-2-3.46-2.49 1a7 7 0 00-2.28-1.32l-.38-2.65h-4l-.38 2.65a7 7 0 00-2.28 1.32l-2.49-1-2 3.46 2.1 1.63A7 7 0 003 12a7 7 0 00.13 1.32l-2.1 1.63 2 3.46 2.49-1a7 7 0 002.28 1.32l.38 2.65h4l.38-2.65a7 7 0 002.28-1.32l2.49 1 2-3.46-2.1-1.63A7 7 0 0021 12z" opacity=".9"/></svg>
      </button>
    </div>

    <!-- Settings drawer -->
    <div class="drawer" id="drawer" hidden>
      <div class="drawer-inner">
        <div class="drawer-head">
          <h2>Settings</h2>
          <button class="icon-btn" id="closeSettings" title="Close">✕</button>
        </div>

        <label class="setting">
          <span>Theme</span>
          <select id="themeSelect">
            <option value="system">System</option>
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </label>

        <label class="setting toggle">
          <span>Play sound when finished</span>
          <input type="checkbox" id="soundEnabled" />
        </label>

        <label class="setting toggle">
          <span>Loop the sound</span>
          <input type="checkbox" id="loopSound" />
        </label>

        <label class="setting toggle">
          <span>Pop up window when finished</span>
          <input type="checkbox" id="popUp" />
        </label>

        <label class="setting toggle">
          <span>Always on top</span>
          <input type="checkbox" id="alwaysOnTop" />
        </label>

        <label class="setting toggle">
          <span>Show countdown in window title</span>
          <input type="checkbox" id="titleProgress" />
        </label>

        <p class="drawer-foot">
          Type a duration (<code>5 minutes</code>, <code>1:30</code>,
          <code>90</code>) or a time (<code>5:30 pm</code>, <code>noon</code>,
          <code>2026-12-31 15:00</code>).
        </p>
      </div>
    </div>
  </div>

  <script src="../timeParser.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
